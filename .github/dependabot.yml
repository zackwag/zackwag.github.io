version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  ignore:
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
  commit-message:
    prefix: chore
    prefix-development: build
    include: scope
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: ci
    include: scope
